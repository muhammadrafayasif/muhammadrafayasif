name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.API_KEY }}

          base: header, repositories, metadata

          config_display: large
          config_padding: 0
          config_timezone: Asia/Karachi

          plugin_notable: yes
          plugin_notable_filter: stars>0
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
          plugin_notable_from: all

          commits_authoring: muhammadrafayasif, muhammadrafay3561@gmail.com, rafay4730069@cloud.neduet.edu.pk

          plugin_activity: no
          plugin_repositories_featured: no
          plugin_languages: no
          plugin_achievements: no
          plugin_topics: no

          # 📄 Output
          filename: metrics.svg
